  <p class="section-tag">NE 300 — Fundamentals of Nuclear Engineering</p>
  <h1>Radioactive Decay Law</h1>
  <div class="card"><p>\[A(t) = A_0 e^{-\lambda t}\]</p><p>Activity decreases exponentially with time. \(A_0\) is the initial activity [Bq], \(\lambda\) is the decay constant [s⁻¹], and \(t\) is elapsed time [s].</p></div>
